# Tine's release Flatpak bundle, built directly from the checked-out tree.
#
# Runtime: org.gnome.Platform//49 — a Tauri Linux app needs webkit2gtk-4.1, which
# ships in the GNOME runtime (not the bare freedesktop runtime). GNOME 49 is built
# on the freedesktop 25.08 base, so the SDK extensions resolve to //25.08. Tauri
# 2.12 needs rustc 1.90, newer than the 24.08 rust-stable extension (1.89).

id: page.tine.Tine
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: tine

finish-args:
  # Display + input.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc            # X11 / WebKit shared memory
  - --device=dri           # GPU access for WebKit compositing
  # Tine plays audio (the media/audio overlay) via WebKitGTK.
  - --socket=pulseaudio
  # Tine reads AND writes the user's real Logseq graph, which can live anywhere
  # the user points the file picker within their home folder.
  - --filesystem=home
  # Network: quick share, update checks and external resources.
  - --share=network
  # Desktop notifications (if used at runtime).
  - --talk-name=org.freedesktop.Notifications
  # System tray (GH #625): lets the tray code see the session's
  # StatusNotifierWatcher. The library half is the libayatana-appindicator
  # module below (the GNOME runtime does not ship it); without either half the
  # build reports "no tray" and shows its window.
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  # Put the SDK-extension toolchains (cargo/rustc, node/npm) on PATH.
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin

modules:
  # libayatana-appindicator3 (+ libdbusmenu, ayatana-ido, libayatana-indicator,
  # intltool), loaded at run time by the tray (src-tauri/src/tray.rs). Vendored
  # byte-for-byte from flathub/shared-modules; see flatpak/README.md.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: tine
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/tine/cargo
        npm_config_cache: /run/build/tine/npm-cache
        # Filled by identity derivation from the shared viewer check's output.
        TINE_QUICK_SHARE_VIEWER_G1_READY: ""
        # Browser binaries are only needed by the separate viewer-check job.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        PLAYWRIGHT_BROWSERS_PATH: "0"
        LC_ALL: C.UTF-8
    build-commands:
      # 1. Install locked node deps (devDeps included — Vite, the
      #    Tauri CLI and TypeScript are devDependencies needed at build time).
      - npm ci
      # 2. Build the frontend bundle (dist/) with its offline PDF assets and
      #    the parser pin guard; the build does no network I/O.
      - npm run build
      # 3. Build the Tauri release binary. custom-protocol is REQUIRED for a release
      #    build (else the app tries to connect to the Vite dev server); tauri-build
      #    embeds dist/ into the binary. Workspace target dir is the repo-root
      #    target/, so the binary lands at target/release/tine.
      - cargo build --release --locked --features custom-protocol -p tine
      # 4. Install artefacts into /app.
      - install -Dm755 target/release/tine /app/bin/tine
      - install -Dm644 flatpak/page.tine.Tine.desktop /app/share/applications/page.tine.Tine.desktop
      - install -Dm644 flatpak/page.tine.Tine.metainfo.xml /app/share/metainfo/page.tine.Tine.metainfo.xml
      - install -Dm644 src-tauri/icons/icon.png       /app/share/icons/hicolor/512x512/apps/page.tine.Tine.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/page.tine.Tine.png
      - install -Dm644 src-tauri/icons/128x128.png    /app/share/icons/hicolor/128x128/apps/page.tine.Tine.png
      - install -Dm644 src-tauri/icons/64x64.png      /app/share/icons/hicolor/64x64/apps/page.tine.Tine.png
      - install -Dm644 src-tauri/icons/32x32.png      /app/share/icons/hicolor/32x32/apps/page.tine.Tine.png
    sources:
      - type: dir
        path: ..
