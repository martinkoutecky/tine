# iOS build and Simulator smoke test.
#
# This remains unsigned and simulator-only, so it needs neither an Apple Developer
# account nor device provisioning. The screenshot is the durable proof that the
# built app launched and opened a real graph in Tine's Documents container.
#
# Manual trigger only — it never runs on push, so it can't burn minutes unattended.
name: App Store shots (proof)

on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Run ID whose built simulator app to reuse (skips the build)'
        required: false
        default: ''

jobs:
  build:
    if: ${{ inputs.reuse_run == '' }}
    runs-on: macos-latest
    timeout-minutes: 45
    # tauri-plugin builds our app-local Swift package through swift-rs with
    # `IPHONEOS_DEPLOYMENT_TARGET`, defaulting to **13.0** when unset
    # (tauri-plugin-2.6.2 src/build/mobile.rs -> tauri_utils::build::link_swift_library).
    # Our Package.swift declares `.iOS(.v14)` because the folder picker uses
    # `UIDocumentPickerViewController(forOpeningContentTypes:)` and `UTType`, both
    # iOS 14+. Pin the deployment target so the Swift build and the package
    # declaration agree.
    #
    # NOTE, so nobody re-derives a wrong story from this block: an earlier version
    # of this comment blamed the deployment-target mismatch for the
    # `Undefined symbols: _init_plugin_tine_ios_folder_picker` failure. That was a
    # guess and it was WRONG — pinning 14.0 changed nothing (run 31279327083).
    # The real cause was Rust-side rlib pruning; see the `extern crate` comment in
    # src-tauri/src/ios_folder_picker.rs. This pin is kept because it is correct,
    # not because it fixed anything.
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      # Pin to the same toolchain the Android mobile build uses (release.yml), so
      # this probes the compiler we'd actually ship mobile with, not a moving stable.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Frontend bundle that `tauri ios init` / the Xcode project reference.
      - name: Build frontend
        run: npm run build

      # --- HARD GATE 1: does the Rust compile for iOS? -----------------------
      # This is the highest-value signal. It exercises every `#[cfg(mobile)]` /
      # `#[cfg(not(desktop))]` path (e.g. the opener plugin added for GH #49) on
      # the real iOS targets — device and simulator. If iOS is going to break,
      # it almost certainly breaks here first, and cheaply.
      #
      # `check`, NOT `build`, and that is deliberate. `tine`'s crate-type
      # includes `cdylib`, so `cargo build --lib` runs a link step — and since
      # `ios_folder_picker` calls a Swift `@_cdecl` symbol, that link can never
      # succeed under bare Cargo:
      #
      #   Undefined symbols: "_init_plugin_tine_ios_folder_picker"
      #
      # The Swift package is compiled and linked by Tauri's native-plugin build
      # path under Xcode/SwiftPM, which is GATE 3 below. `cargo build` here was
      # correct only while no Swift existed. `check` keeps the fast, precise
      # compile signal — it is what caught the E0425 cfg gap and the E0428
      # duplicate-command collision — and leaves linking to the gate that can
      # actually do it. Do not "restore" this to `build`.
      # iOS must present exactly ONE window. The base config declares `main` AND
      # the always-on-top quick-capture mini window, both `visible: false` and
      # revealed programmatically on desktop. UIKit has no such model: it presents
      # a window per webview, and `capture` — declared second — covered `main`.
      # Run 31298413218 passed every runtime assertion while showing the capture
      # UI, which is why this guard is a step and not a comment.
      # `tauri.android.conf.json` already solved this; `tauri.ios.conf.json`
      # mirrors it. Deleting either file silently reintroduces the bug.
      - name: Assert iOS declares a single window
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("src-tauri/tauri.ios.conf.json"))
          windows = cfg["app"]["windows"]
          labels = [w.get("label") for w in windows]
          if labels != ["main"]:
              sys.exit(f"iOS must declare exactly one window ['main'], got {labels}. "
                       "A second window (e.g. 'capture') is presented by UIKit and "
                       "covers the graph.")
          print("ok: iOS declares a single 'main' window")
          PY

      # --- HARD GATE 2: does the Xcode project generate? ---------------------
      # The app-local Swift package is compiled through Tauri's native-plugin
      # build path; gen/apple remains generated CI output rather than source.
      - name: tauri ios init
        run: npx tauri ios init --ci --verbose

      # The committed project patch (ADR 0073, I1): app-target Swift (App
      # Intents, share inbox producer), the Share Extension target, App Group
      # entitlements, PrivacyInfo and icons. Unsigned here: no signing env.
      - name: Prepare the generated iOS project
        run: npm run ios:prepare-project

      # Simulator builds are unsigned. This catches Swift/plugin/plist failures
      # that the Rust cross-compiles cannot see.
      - name: tauri ios build (simulator, unsigned)
        run: npx tauri ios build --target aarch64-sim --ci

      - name: Package the simulator app
        run: |
          APP_PATH="$(find src-tauri/gen/apple target -type d -name 'Tine.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p packaged
          ditto -c -k --keepParent "$APP_PATH" packaged/Tine.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tine-sim-app
          path: packaged/Tine.app.zip

  shots:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tine-sim-app
          path: packaged
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Take the screenshots
        run: |
          set -euo pipefail
          ditto -x -k packaged/Tine.app.zip packaged/x
          scripts/appstore-shots.sh packaged/x/Tine.app shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-shots
          if-no-files-found: warn
          path: shots
