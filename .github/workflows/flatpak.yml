# Builds our installable .flatpak bundle from the checked-out tree.
# The committed files carry the released
# identity; for any other identity scripts/derive-flatpak-identity.mjs derives the
# app id, name and release list at build time. The `identity` input must name the
# identity the tree ships (src-tauri/app-identity.json); a mismatch is refused,
# because the binary takes its data directories from that switch.
name: Flatpak build test

on:
  workflow_call:
    inputs:
      identity:
        description: Identity to package (release or experiment); must match the tree's ship
        type: string
        default: release
  workflow_dispatch:
    inputs:
      identity:
        description: Identity to package (release or experiment); must match the tree's ship
        type: choice
        options: [release, experiment]
        default: release

# Release calls this expensive build as a hard gate; focused Flatpak work can
# dispatch it manually.

# One in-flight build per ref; a newer manual/called run cancels the older run.
concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer-ready:
    runs-on: ubuntu-latest
    outputs:
      quick_share_viewer_g1_ready: ${{ steps.viewer-ready.outputs.quick_share_viewer_g1_ready }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed quick share viewer before enabling the writer
        id: viewer-ready
        continue-on-error: true
        run: node scripts/check-release-readiness.mjs --quick-share-only

  flatpak-builder:
    needs: viewer-ready
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v5

      # The container image carries python but no node; the derivation script is
      # node because it shares scripts/lib/app-identity.mjs with the release layout.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive a CI manifest that builds the checked-out tree
        id: derive
        env:
          FLATPAK_IDENTITY: ${{ inputs.identity }}
          TINE_QUICK_SHARE_VIEWER_G1_READY: ${{ needs.viewer-ready.outputs.quick_share_viewer_g1_ready }}
        run: node scripts/derive-flatpak-identity.mjs --identity "$FLATPAK_IDENTITY"

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tine.flatpak
          manifest-path: ${{ steps.derive.outputs.manifest }}
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.arch }}
          # The explicit upload step below names the artifact; skip the action's own.
          upload-artifact: false
          # The action only composes the appstream data; it does not lint it. The
          # derived metainfo/.desktop are linted by flatpak-metadata.yml.

      - name: Upload .flatpak bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tine-flatpak-${{ matrix.arch }}
          path: tine.flatpak
          if-no-files-found: ignore
