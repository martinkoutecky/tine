# Flatpak build test — validates the Flathub no-network manifest by actually
# building it (offline vendored cargo + npm sources) in a privileged flatpak
# container, and uploads an installable .flatpak bundle. This is the build-test we
# can't run locally (the dev sandbox can't nest bwrap / mount proc).
#
# It does NOT submit to Flathub. It builds the CURRENTLY CHECKED-OUT tree by
# deriving a `dir`-source manifest from the committed Flathub manifest, so
# flatpak/page.tine.Tine.yml stays the single source of truth (its git source stays
# pinned for the real Flathub submission). The committed files carry the released
# identity; for any other identity scripts/derive-flatpak-identity.mjs derives the
# app id, name and release list at build time. The `identity` input must name the
# identity the tree ships (src-tauri/app-identity.json); a mismatch is refused,
# because the binary takes its data directories from that switch.
name: Flatpak build test

on:
  workflow_call:
    inputs:
      identity:
        description: Identity to package (release or experiment); must match the tree's ship
        type: string
        default: release
  workflow_dispatch:
    inputs:
      identity:
        description: Identity to package (release or experiment); must match the tree's ship
        type: choice
        options: [release, experiment]
        default: release

# The real offline build is expensive. Release calls it as a hard gate; focused
# Flatpak work can dispatch it manually. Source-manifest drift is covered by the
# lightweight PR/full-CI scripts, so master pushes do not start another build.

# One in-flight build per ref; a newer manual/called run cancels the older run.
concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-builder:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v5

      # The container image carries python but no node; the derivation script is
      # node because it shares scripts/lib/app-identity.mjs with the release layout.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive a CI manifest that builds the checked-out tree
        id: derive
        env:
          FLATPAK_IDENTITY: ${{ inputs.identity }}
        run: node scripts/derive-flatpak-identity.mjs --identity "$FLATPAK_IDENTITY"

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tine.flatpak
          manifest-path: ${{ steps.derive.outputs.manifest }}
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.arch }}
          # Validation of appstream metainfo + .desktop is on by default in the
          # action; leave it on so we catch Flathub lint failures here.

      - name: Upload .flatpak bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tine-flatpak-${{ matrix.arch }}
          path: tine.flatpak
          if-no-files-found: ignore
