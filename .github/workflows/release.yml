# Assemble immutable release candidates by manual dispatch. publish=false
# writes workflow artifacts only. The updater endpoint in tauri.conf.json picks
# the channel (scripts/release-policy.mjs): a Beta build publishes only to the
# moving beta tag as a prerelease, never latest; a stable build publishes only
# to v<version>, which must already point at the commit, marked latest.
#
# Signing: the macOS lane fails closed unless it can sign with Tine's Developer
# ID certificate, notarize with a short-lived App Store Connect API token, and
# validate the stapled ticket (GH #650: unsigned Beta builds were refused by
# Gatekeeper). It uses the same repository secrets as the stable workflow.
# Windows installers remain unsigned for now.
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Assemble a new candidate (no promotion path); the updater endpoint picks beta or stable
        type: choice
        options: [build]
        default: build
        required: true
      publish:
        description: Publish after verification (Beta to the moving beta tag; stable to v<version>, marked latest)
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap deterministic guards run before any expensive release build.
  # Scope: Linux, Windows NSIS, macOS, Android and the x86_64 Flatpak bundle
  # (a manual-update download; the updater manifest never references it).
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require exact-SHA full CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVIDENCE_SHA: ${{ github.sha }}
          CI_EVIDENCE_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-ci-evidence.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Require updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for release smoke and tagged releases."
            exit 1
          fi
      - name: Version, Android code, tag, and changelog agree
        env:
          REQUIRE_RELEASE_READINESS: "1"
        run: node scripts/check-release-preflight.mjs
      - name: lsdoc WASM pin is current
        run: node scripts/check-wasm-pin.mjs
      - name: lsdoc oracle bytes and cross-platform EOL policy are current
        run: node scripts/check-lsdoc-oracle-sync.mjs
      - name: Release pipeline contract fixtures
        run: |
          node scripts/test-release-pipeline.mjs
          node scripts/test-env-toolchain-fallback.mjs

  # Build each desktop platform concurrently. Jobs never mutate a GitHub Release;
  # they upload immutable workflow artifacts for the assembler/publisher below.
  build:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - platform: ubuntu-22.04
            lane: linux-x64
            args: "--features custom-protocol"
            rust-targets: ""
          # Linux ARM64: built NATIVELY on GitHub's aarch64 runner (free on public
          # repos). No cross-compile — GTK/WebKitGTK are system libs that are
          # painful to cross-compile, so we install the arm64 -dev packages on the
          # arm runner exactly like the x86 job. Audience: Asahi (fine) + Pi/SBC
          # (will feel WebKitGTK's paint cost). Ships .deb + raw binary (AppImage
          # tooling on ARM is historically flaky, so it's fine if that bundle is skipped).
          - platform: ubuntu-22.04-arm
            lane: linux-arm64
            args: "--features custom-protocol"
            rust-targets: ""
          - platform: macos-latest
            lane: macos-universal
            # one universal binary that runs on both Apple Silicon and Intel
            args: "--target universal-apple-darwin --features custom-protocol"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            lane: windows-x64
            args: "--features custom-protocol"
            rust-targets: ""
            win-arch: x64
            win-exe-dir: target/release
          # Experimental Windows 32-bit pilot (GH #275), as on stable:
          # installer + portable ZIP, with manual updates only.
          - platform: windows-latest
            lane: windows-x86
            args: "--target i686-pc-windows-msvc --features custom-protocol"
            rust-targets: "i686-pc-windows-msvc"
            win-arch: x86
            win-exe-dir: target/i686-pc-windows-msvc/release
          # Windows ARM64 (Surface Pro X, Snapdragon X laptops): CROSS-compiled from
          # the x86_64 windows runner. rustup adds the target; the VS 2022 ARM64 MSVC
          # tools are preinstalled on the windows-latest image. A `--target <triple>`
          # build outputs under target/<triple>/release/ (NOT target/release/), which
          # `win-exe-dir` below threads into the portable-zip step. WebView2 exists on
          # Windows ARM64, so the runtime is fine.
          - platform: windows-latest
            lane: windows-arm64
            args: "--target aarch64-pc-windows-msvc --features custom-protocol"
            rust-targets: "aarch64-pc-windows-msvc"
            win-arch: arm64
            win-exe-dir: target/aarch64-pc-windows-msvc/release
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev \
            webkit2gtk-driver xvfb xauth xdotool openbox x11-utils weston zsync faketime

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          # Cargo workspace is the repo ROOT (target/ lives there, not src-tauri/)
          workspaces: ". -> target"

      - run: npm ci

      - name: Install Linux release-suite browser
        if: matrix.lane == 'linux-x64'
        run: npx playwright install --with-deps chromium

      - name: Snapshot Linux E2E candidate inputs
        if: matrix.lane == 'linux-x64'
        run: node scripts/build-e2e-receipt.mjs before --snapshot target/release/tine.build.before.json

      - name: Snapshot Windows E2E candidate inputs
        if: matrix.lane == 'windows-x64'
        run: node scripts/build-e2e-receipt.mjs before --tauri-manifest-normalization --snapshot target/release/tine.exe.build.before.json

      - name: Derive release filenames and update information
        shell: bash
        run: node scripts/release-workflow-inputs.mjs "${{ matrix.lane }}" >> "$GITHUB_ENV"

      - name: Prepare macOS signing and notarization credentials
        if: matrix.lane == 'macos-universal'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::required macOS signing secret $name is missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # macOS 26 no longer reliably infers PKCS#12 input when Tauri asks
          # `security import` to install APPLE_CERTIFICATE itself. Import the
          # Developer ID identity explicitly into a temporary keychain, just as
          # the iOS lane does for its distribution identity, and do not expose
          # APPLE_CERTIFICATE to the later Tauri process.
          keychain="$RUNNER_TEMP/tine-macos-signing.keychain-db"
          p12="$RUNNER_TEMP/tine-macos-developer-id.p12"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          # App notarization is an external queue and has legitimately taken
          # longer than an hour.  Keep the ephemeral keychain unlocked for the
          # whole maximum job lifetime so the later DMG signature cannot block
          # on an invisible password prompt after the app was accepted.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"

          keychains=("$keychain")
          while IFS= read -r listed; do
            listed="${listed//\"/}"
            listed="${listed#"${listed%%[![:space:]]*}"}"
            [ -n "$listed" ] && keychains+=("$listed")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain" |
            grep -Fq "$APPLE_SIGNING_IDENTITY"
          rm -f "$p12"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          key_dir="$RUNNER_TEMP/app-store-connect-private-keys"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          install -d -m 700 "$key_dir"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build Tauri bundles
        if: matrix.lane != 'macos-universal'
        env:
          # Updater signing (minisign) — the app-update root of trust, SEPARATE from
          # OS code-signing. REQUIRED once `bundle.createUpdaterArtifacts` is true:
          # the bundler signs each updater artifact with this key, and the installed
          # app verifies against `plugins.updater.pubkey` in tauri.conf.json. Add the
          # two repo secrets (see docs/adr/0011) BEFORE tagging the next release, or
          # the signing step fails. Empty ⇒ signing skipped (fine only while no
          # updater artifacts are produced).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy-plugin-appimage passes this to appimagetool, which embeds
          # the .upd_info section and creates the matching .zsync metadata.
          # Newer plugin builds read LDAI_UPDATE_INFORMATION and only warn on the
          # deprecated UPDATE_INFORMATION; set both so any plugin version embeds it.
        run: node scripts/build-release-bundles.mjs -- ${{ matrix.args }}

      # OS code-signing and notarization, isolated to the macOS lane. The
      # identity is installed explicitly by the preparation step above, so
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD are deliberately NOT
      # passed here: with them set the Tauri bundler would re-import the PKCS#12
      # itself (unreliable on macOS 26), and an EMPTY APPLE_CERTIFICATE makes it
      # attempt `security import` and fail. The preparation step already refuses
      # to continue when any secret is empty. Notarization reads APPLE_API_KEY,
      # APPLE_API_ISSUER and APPLE_API_KEY_PATH (exported by that step);
      # APPLE_SIGNING_IDENTITY selects the Developer ID Application identity.
      - name: Build signed and notarized macOS bundles
        if: matrix.lane == 'macos-universal'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/build-release-bundles.mjs -- ${{ matrix.args }}

      - name: Verify macOS signature and stapled notarization ticket
        if: matrix.lane == 'macos-universal'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=$(find target -type f -path '*/bundle/dmg/*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "::error::signed macOS DMG is missing"
            exit 1
          fi

          # Tauri's DMG bundler deliberately removes its temporary standalone
          # .app after embedding it. Verify the actual shipped application,
          # not that transient build path.
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/tine-release-dmg"
          mkdir -p "$mount"
          mounted=0
          cleanup_dmg() {
            if [ "$mounted" -eq 1 ]; then
              hdiutil detach "$mount" || true
            fi
          }
          trap cleanup_dmg EXIT
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          mounted=1
          app=$(find "$mount" -maxdepth 2 -type d -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::signed macOS app is missing from the release DMG"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2> "$RUNNER_TEMP/tine-codesign.txt"
          grep -Fq 'Authority=Developer ID Application:' "$RUNNER_TEMP/tine-codesign.txt"
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/tine-codesign.txt"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Verify Linux AppImage update information
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          appimage_dir=./target/release/bundle/appimage
          appimage="$appimage_dir/$RELEASE_APPIMAGE"
          zsync_name="$RELEASE_ZSYNC"
          # appimagetool writes the .zsync into the tauri build CWD (src-tauri/),
          # NOT beside the AppImage in the bundle dir. Check the known candidate
          # locations, then fall back to a whole-tree search so a future CWD change
          # cannot silently drop it (that false "missing" was the GH #222 bug).
          zsync_source=""
          for cand in \
            "./src-tauri/$zsync_name" \
            "$appimage_dir/$zsync_name" \
            "./$zsync_name"; do
            if [ -f "$cand" ]; then zsync_source="$cand"; break; fi
          done
          if [ -z "$zsync_source" ]; then
            zsync_source=$(find . -type f -name "$zsync_name" -print -quit 2>/dev/null)
          fi
          if [ -z "$zsync_source" ]; then
            echo "::error::missing AppImage update metadata: $zsync_name"
            exit 1
          fi
          if [ "$zsync_source" != "$appimage_dir/$zsync_name" ]; then
            mv "$zsync_source" "$appimage_dir/$zsync_name"
          fi
          if [ ! -f "$appimage" ] || [ ! -f "$appimage_dir/$zsync_name" ]; then
            echo "::error::AppImage or update metadata is not staged beside the bundle"
            exit 1
          fi
          if ! readelf --string-dump=.upd_info "$appimage" | grep -Fq 'gh-releases-zsync|'; then
            echo "::error::AppImage is missing embedded update information"
            exit 1
          fi

      - name: Write Linux E2E candidate receipt
        if: matrix.lane == 'linux-x64'
        run: node scripts/build-e2e-receipt.mjs after --snapshot target/release/tine.build.before.json --app target/release/tine

      - name: Write Windows E2E candidate receipt
        if: matrix.lane == 'windows-x64'
        run: node scripts/build-e2e-receipt.mjs after --snapshot target/release/tine.exe.build.before.json --app target/release/tine.exe

      # Portable Windows build: the compiled Tauri exe is already self-contained
      # (frontend + lsdoc-wasm are embedded; WebView2Loader is statically linked),
      # so "portable" is just that one exe, zipped. The NSIS installer we also
      # ship wraps this same binary; the portable zip skips the installer AND its
      # WebView2 bootstrapper — WebView2 is preinstalled on Windows 10/11, so this
      # runs for ~everyone, but a machine without the runtime won't launch it.
      - name: Package portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # A cross-target build (x86/ARM64) outputs under target/<triple>/release/, a
          # native build (x64) under target/release/ — matrix.win-exe-dir carries the
          # right one. Tauri v2 may rename the main binary to productName;
          # the cargo bin name is "tine.exe". Pick whichever exists — and NOT the
          # secondary "tine-check.exe" helper binary.
          $dir = "${{ matrix.win-exe-dir }}"
          $exe = @("$dir/$env:RELEASE_PRODUCT_NAME.exe", "$dir/tine.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "portable: main Tine exe not found under $dir" }
          $zip = $env:RELEASE_PORTABLE
          Compress-Archive -Path $exe -DestinationPath $zip -Force

      # The expensive Linux build above is also the exact binary under test and
      # is a hard publication gate. Windows advisory evidence runs independently
      # from the staged portable artifact below so it cannot serialize assembly.
      - name: Install Tauri WebDriver bridge
        if: matrix.lane == 'linux-x64'
        run: cargo install tauri-driver --locked

      - name: Gate Linux x64 on the complete real-app regression catalog
        if: matrix.lane == 'linux-x64'
        env:
          E2E_ALLOW_SYNTHETIC_FOCUS: "1"
          TINE_E2E_MODE: release
        run: npm run e2e:linux:release

      - name: Gate Linux x64 on the signed plugin catalogue lifecycle
        if: matrix.lane == 'linux-x64'
        run: npm run e2e:plugins

      - name: Upload release E2E evidence
        if: always() && matrix.lane == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-${{ matrix.lane }}
          path: test-results/e2e
          if-no-files-found: warn
          retention-days: 14

      # The staged Windows smoke jobs verify that the downloaded portable exe
      # embeds this exact production frontend.  Preserve the already-built dist
      # once instead of rebuilding it independently in every advisory job.
      - name: Upload exact Windows x64 frontend proof
        if: matrix.lane == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-frontend-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload exact Windows x64 E2E receipt
        if: matrix.lane == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-receipt-windows-x64
          path: target/release/tine.exe.build.json
          if-no-files-found: error
          retention-days: 3

      - name: Stage immutable release artifact
        run: node scripts/stage-release-lane.mjs "${{ matrix.lane }}" release-candidate "${{ github.sha }}"

      - name: Upload release lane
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.lane }}
          path: release-candidate/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove macOS signing material
        if: always() && matrix.lane == 'macos-universal'
        shell: bash
        run: |
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/app-store-connect-private-keys"
          rm -f "$RUNNER_TEMP/tine-macos-developer-id.p12"
          rm -f "$RUNNER_TEMP/tine-codesign.txt"

  # Advisory Windows scenarios consume the already-staged portable x64 binary.
  # They run on independent hosts and in parallel with candidate assembly, so a
  # bad runner neither cascades into 0/N evidence nor delays atomic publication.
  # Job-level continue-on-error keeps the advisory policy while leaving each
  # scenario's real failure visible instead of turning one 0/N step green.
  windows-smoke:
    needs: [preflight, build]
    # A failure in another build-matrix lane (for example the hard Linux E2E
    # gate) must not suppress evidence from an already-staged Windows x64 app.
    # If x64 itself failed, the artifact download below fails visibly instead.
    if: ${{ always() && needs.preflight.result == 'success' && needs.build.result != 'cancelled' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # og-parity-references stays a hard Linux gate; dropped from the advisory
          # Windows suite only (unclassified WebView2 trailing-space, AGENTS.md §2b
          # E2E stop-loss). See scripts/run-e2e.mjs windows-smoke suite for rationale.
          - windows-core
          - page-properties
          - page-trailing-block
          - pdf-logseq
          - print-security
          - tab-overflow
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          # Stage OUTSIDE the worktree. The E2E build receipt binds the app to the
          # clean-checkout build-input digest (git ls-files -co --untracked=all).
          # A download into the worktree adds untracked, non-ignored files that
          # poison that digest and make every advisory Windows scenario fail with
          # "built from different build inputs" — the Linux E2E runs inside the
          # build job, so it never hit this. `dist/` below is fine: it is gitignored.
          path: ${{ runner.temp }}/release-windows-x64
      - name: Download the exact embedded frontend proof
        uses: actions/download-artifact@v4
        with:
          name: release-e2e-frontend-windows-x64
          path: dist
      - name: Download the exact Windows x64 E2E receipt
        uses: actions/download-artifact@v4
        with:
          name: release-e2e-receipt-windows-x64
          path: ${{ runner.temp }}/tine-receipt
      - name: Extract the exact staged portable app
        shell: pwsh
        run: |
          node scripts/release-workflow-inputs.mjs windows-x64 | ForEach-Object {
            $key, $value = $_ -split '=', 2
            Set-Item "Env:$key" $value
          }
          $zip = Get-Item "$env:RUNNER_TEMP\release-windows-x64\$env:RELEASE_PORTABLE"
          if (-not $zip) { throw "staged Windows portable zip is missing" }
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\tine-portable" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\tine-portable" -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw "portable Tine executable is missing" }
          "TINE_APP=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TINE_E2E_BUILD_RECEIPT=$env:RUNNER_TEMP\tine-receipt\tine.exe.build.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Edge WebDriver matching the hosted browser
        shell: pwsh
        run: |
          $edgeExe = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edgeExe)) { throw "Microsoft Edge not found at $edgeExe" }
          $version = (Get-Item $edgeExe).VersionInfo.ProductVersion
          $driverDir = "$env:RUNNER_TEMP\edgedriver"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $driverDir -Force
          $driverDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$driverDir\msedgedriver.exe" --version
      - name: Run advisory Windows x64 real-app scenario
        env:
          TINE_E2E_MODE: release
        run: npm run e2e:windows:smoke -- --scenario=${{ matrix.scenario }}
      - name: Upload Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-windows-x64-${{ matrix.scenario }}
          path: test-results/e2e/windows-smoke
          if-no-files-found: warn
          retention-days: 14

  # The Flatpak bundle builds concurrently from the same offline manifest the
  # dedicated "Flatpak build test" workflow uses, packaged under the Beta
  # identity so it installs beside a stable Tine Flatpak. A build failure fails
  # this job, which blocks assembly like any other platform. The identity is the
  # one the tree ships (src-tauri/app-identity.json); flipping the switch to the
  # released identity makes the derivation refuse until this line follows it
  # (src/flatpakPackaging.guard.test.ts pins that).
  flatpak:
    needs: preflight
    uses: ./.github/workflows/flatpak.yml
    with:
      identity: experiment

  # Name the bundle by the release layout and stage it as an immutable lane,
  # exactly like the other platforms.
  stage-flatpak:
    needs: [preflight, flatpak]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: tine-flatpak-x86_64
          path: flatpak-bundle
      - name: Derive release filenames
        run: node scripts/release-workflow-inputs.mjs flatpak-x64 >> "$GITHUB_ENV"
      - name: Stage immutable Flatpak artifact
        run: |
          if [ ! -f flatpak-bundle/tine.flatpak ]; then
            echo "::error::the Flatpak build produced no bundle"
            exit 1
          fi
          mv flatpak-bundle/tine.flatpak "$RELEASE_FLATPAK"
          node scripts/stage-release-lane.mjs flatpak-x64 release-candidate "${{ github.sha }}"
      - name: Upload Flatpak release lane
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-x64
          path: release-candidate/flatpak-x64
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # Android builds concurrently and contributes another immutable workflow
  # artifact. Signed Android output is mandatory for every release smoke/tag.
  #     The private signing key lives ONLY in encrypted repo secrets — never in the
  #     repo or on a build host (see docs/ANDROID-RELEASE.md). Add these once, on the
  #     machine that holds the .jks (Settings → Secrets, or `gh secret set`):
  #       ANDROID_KEYSTORE_BASE64    base64 of the .jks   (`base64 -w0 tine-release.jks`)
  #       ANDROID_KEYSTORE_PASSWORD  keystore password
  #       ANDROID_KEY_ALIAS          key alias (e.g. tine)
  #       ANDROID_KEY_PASSWORD       key password
  android:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # secrets can't be used in a job-level `if:`, so gate every real step on this.
      # `secrets.X != ''` evaluates to a boolean without ever printing the secret.
      - name: Detect signing secret
        id: sign
        run: echo "enabled=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Require Android signing
        if: steps.sign.outputs.enabled != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is required for release smoke and tagged releases."
          exit 1

      - uses: actions/setup-java@v4
        if: steps.sign.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        if: steps.sign.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm

      # Pinned to match the F-Droid build recipe EXACTLY (metadata/page.tine.app.yml
      # uses `rustup default 1.96.0`). Reproducible builds require the developer's
      # APK and F-Droid's rebuild to use the same compiler, so this must not drift
      # to `stable`. Bump both together.
      - uses: dtolnay/rust-toolchain@1.96.0
        if: steps.sign.outputs.enabled == 'true'
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        if: steps.sign.outputs.enabled == 'true'
        with:
          workspaces: ". -> target"

      # Match the local toolchain exactly (compileSdk 36; NDK 26.3.11579264).
      - name: Install Android SDK packages
        if: steps.sign.outputs.enabled == 'true'
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;26.3.11579264" "platform-tools" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          # Point EVERY NDK env var at 26.3 — incl. ANDROID_NDK_LATEST_HOME, which the
          # runner presets to a newer preinstalled NDK. Without this override, the
          # Android build linked with that newer NDK's clang/lld 21 instead of 26.3's
          # clang/lld 17, which is what F-Droid's recipe (`ndk: 26.3.11579264`) uses —
          # different linker ⇒ different .so layout ⇒ reproducibility verify fails.
          for v in NDK_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME; do
            echo "$v=$NDK" >> "$GITHUB_ENV"
          done
          # Env vars alone are NOT enough: the .so is linked by the tauri CLI (gradle's
          # RustPlugin shells out to `tauri android build`), which resolved a NEWER
          # preinstalled NDK's clang/lld 21 despite the env pin. Delete every other NDK
          # so 26.3 is the ONLY one anything can find — exactly the local (clang 17)
          # condition. With ndkVersion pinned in app/build.gradle.kts, AGP won't
          # re-download its default.
          find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d ! -name "26.3.11579264" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$ANDROID_SDK_ROOT/ndk-bundle" 2>/dev/null || true
          echo "NDKs remaining on runner:"; ls "$ANDROID_SDK_ROOT/ndk"
          # Fail loudly if 26.3's clang isn't the one that'll be used.
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      - name: Install JS deps
        if: steps.sign.outputs.enabled == 'true'
        run: npm ci

      # Decode the keystore + write the gitignored signing config the Gradle build
      # reads. Both are removed in the final step regardless of outcome.
      - name: Write signing config from secrets
        if: steps.sign.outputs.enabled == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tine-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/tine-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > src-tauri/gen/android/keystore.properties

      # PV1 Android keeps its generated Kotlin namespace for Tauri's source
      # lookup, while installation identity and version code derive from the switch.
      - name: Prepare Android namespace and version
        if: steps.sign.outputs.enabled == 'true'
        run: |
          node scripts/release-workflow-inputs.mjs android-config
          node scripts/release-workflow-inputs.mjs android >> "$GITHUB_ENV"

      - name: Build signed Android APK
        if: steps.sign.outputs.enabled == 'true'
        # Reproducible build (F-Droid #reproducible): canonicalize build-location paths
        # so the native lib's module-id hash matches F-Droid's rebuild regardless of
        # where each ran. Must stay identical to the RUSTFLAGS in the F-Droid recipe
        # (metadata/page.tine.app.yml). Paired with codegen-units=1 (Cargo.toml) and the
        # commit-time __BUILD_TIME__ (vite.config.ts).
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          npx tauri android build --target aarch64 --apk

      - name: Prepare canonical Android APK
        if: steps.sign.outputs.enabled == 'true'
        run: |
          # The signed artifact is app-universal-release.apk (the unsigned build
          # would end in -release-unsigned.apk, which this glob excludes).
          apk=$(find src-tauri/gen/android -path '*/release/*' -name '*-release.apk' | head -1)
          if [ -z "$apk" ]; then echo "no signed APK found"; exit 1; fi
          cp "$apk" "$RELEASE_APK"

      # Android API < 30 does not export bionic's renameat2 wrapper. A source
      # check missed a second call in GH #192, so inspect the final linked .so
      # that users will actually load and fail the release before publication.
      - name: Verify Android 9 native-loader compatibility
        if: steps.sign.outputs.enabled == 'true'
        run: |
          apk="$RELEASE_APK"
          unzip -p "$apk" lib/arm64-v8a/libtine_lib.so > "$RUNNER_TEMP/libtine_lib.so"
          if readelf --dyn-syms --wide "$RUNNER_TEMP/libtine_lib.so" \
            | grep -Eq '[[:space:]]UND[[:space:]].*renameat2(@|$)'; then
            echo "::error::Android native library imports API-30 renameat2; it will not load on Android 9/API 28."
            exit 1
          fi
          readelf --dyn-syms --wide "$RUNNER_TEMP/libtine_lib.so" | grep -F 'syscall@' >/dev/null

      - name: Stage immutable Android artifact
        if: steps.sign.outputs.enabled == 'true'
        run: node scripts/stage-release-lane.mjs android release-candidate "${{ github.sha }}"

      - name: Upload Android release lane
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-candidate/android
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tine-release.jks" src-tauri/gen/android/keystore.properties

  # Merge immutable lane artifacts and generate latest.json exactly once. Manual
  # dispatch stops after uploading this verified candidate and never touches a
  # GitHub Release.
  assemble:
    needs: [preflight, build, android, stage-flatpak]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
      - name: Assemble and verify complete candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/assemble-release-candidate.mjs release-input release-candidate-assembled
      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-candidate-assembled
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # The sole release writer. Expensive builds have already finished; this job
  # creates/reuses a draft, uploads distinct assets, uploads latest.json last,
  # re-downloads and verifies the draft, then publishes it.
  publish-release:
    needs: assemble
    if: inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-candidate
      - name: Upload, verify, and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: node scripts/publish-release-candidate.mjs "$(node --input-type=module -e 'import { releaseTag } from "./scripts/release-policy.mjs"; import fs from "node:fs"; process.stdout.write(releaseTag(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"))))')" release-candidate
