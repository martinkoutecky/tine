name: spike-multiwindow
on:
  push:
    branches: [spike-multiwindow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev build-essential libssl-dev webkit2gtk-driver xvfb xauth xdotool openbox x11-utils imagemagick
      - run: npm ci
      - run: npm run build
      - run: cargo build --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Linux native probe and OS keyboard input
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 2000x1100x24' dbus-run-session -- bash -c 'openbox > /tmp/openbox.log 2>&1 & node scripts/spike-multiwindow/run.mjs'
      - name: Windows or macOS native probe and OS keyboard input
        if: runner.os != 'Linux'
        run: node scripts/spike-multiwindow/run.mjs
      - name: Upload per-check evidence (even on crash or timeout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-multiwindow-${{ matrix.os }}
          path: test-results/spike-multiwindow
          if-no-files-found: warn
