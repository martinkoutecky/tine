# Proof-only (exp/play-pepk): record the Play "All files access" demo video on an emulator.
name: Play all-files-access demo video
on:
  push:
    branches: [exp/play-pepk]
    paths: [play-video/**, scripts/play-video/**, .github/workflows/play-video.yml]
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get the released APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.2 -R martinkoutecky/tine -p 'Tine_0.7.2_android-arm64.apk' -O tine.apk
          sha256sum tine.apk
      - name: Prepare demo graph
        run: |
          cp -r play-video/graph "Tine demo"
          mkdir -p "Tine demo/assets" out
          find "Tine demo" -type f
      - name: Run the emulator and record
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.build.version.release
            adb shell date
            adb install -r tine.apk
            adb shell mkdir -p /sdcard/Documents
            DEV=$(adb shell date +%Y_%m_%d | tr -d '\r'); DEVY=$(adb shell date -d @$(( $(adb shell date +%s | tr -d '\r') - 86400 )) +%Y_%m_%d | tr -d '\r'); echo "device dates $DEV $DEVY"
            [ "$DEV" = 2026_10_14 ] || mv "Tine demo/journals/2026_10_14.md" "Tine demo/journals/$DEV.md"
            [ "$DEVY" = 2026_10_13 ] || mv "Tine demo/journals/2026_10_13.md" "Tine demo/journals/$DEVY.md"
            adb push "Tine demo" /sdcard/Documents/
            adb shell ls -R "/sdcard/Documents/Tine\ demo"
            python3 scripts/play-video/drive.py out || echo "DRIVE FAILED $?"
      - name: Post-process
        if: always()
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          ls -la out || true
          if [ -f out/raw.mp4 ] && [ -f out/events.json ]; then python3 scripts/play-video/post.py out; fi
          ls -la out; sha256sum out/*.mp4 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: play-video, path: out/, retention-days: 7 }
