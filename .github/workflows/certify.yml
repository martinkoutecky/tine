name: certify

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-complete:
    name: Linux complete physical suite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      # Unix crash tests spawn the current test binary. In a parallel libtest
      # run, the fork/exec window can transiently inherit another test's locked
      # journal descriptor and cause a spurious SegmentAlreadyOpen. Serializing
      # the physical suite removes that harness interaction without weakening
      # any protocol assertion.
      - run: cargo test --locked --all-features -- --test-threads=1
      - name: Timed Patricia 4096-record physical burn-in
        shell: bash
        run: |
          started=$SECONDS
          cargo test --locked -p tine-storage \
            authenticated_patricia::tests::physical_publication_reopens_exactly_for_4096_records_burn_in \
            -- --exact --ignored --nocapture
          elapsed=$((SECONDS - started))
          echo "Linux Patricia 4096-record physical burn-in: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"

  windows-complete:
    name: Windows complete physical suite
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: swatinem/rust-cache@v2
      # Run each physical test in its own process. Besides preventing one native
      # Windows abort from hiding every later result, this gives certification a
      # complete fail-before receipt instead of the libtest process's first
      # aggregate crash code.
      - name: Install cargo-nextest 0.9.143
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
      - name: Windows write-through v2 journal public boundary
        run: >
          cargo test --locked --test public_boundary
          journal_v2_can_be_prepared_opened_and_appended_from_the_public_api
          -- --exact --nocapture
      - name: Windows write-through v2 journal fault boundary
        run: >
          cargo test --locked --lib
          local_journal_v2::windows_tests::injected_windows_replacement_error_reopens_to_old_or_successor_once
          -- --exact --nocapture
      - run: cargo nextest run --locked --all-features --no-fail-fast
      - name: Timed Patricia 4096-record physical burn-in
        shell: pwsh
        run: |
          $started = Get-Date
          cargo test --locked -p tine-storage `
            authenticated_patricia::tests::physical_publication_reopens_exactly_for_4096_records_burn_in `
            -- --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elapsed = [math]::Round(((Get-Date) - $started).TotalSeconds, 2)
          $summary = "Windows Patricia 4096-record physical burn-in: ${elapsed}s"
          Write-Host $summary
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  android-compile:
    name: Android arm64 compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
      - name: Install the Tine Android NDK compiler
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.3.11579264" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo check --locked --target aarch64-linux-android

  api-semver:
    name: Public API and semver
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked api_surface
      - run: cargo test --locked --test public_boundary
      - name: Check against the preceding storage tag when one exists
        shell: bash
        run: |
          baseline="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$baseline" ]; then
            echo "Initial release: no semver baseline exists yet."
            exit 0
          fi
          cargo install cargo-semver-checks --locked --version 0.50.0
          cargo semver-checks check-release --baseline-rev "$baseline"

  receipt:
    name: Immutable certification receipt
    needs: [linux-complete, windows-complete, android-compile, api-semver]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Require tag/package agreement for tagged certification
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Generate exact receipt
        run: bash scripts/generate-certification-receipt.sh certification-receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tine-storage-certification-${{ github.sha }}
          path: certification-receipt.txt
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: certification-receipt.txt
      - name: Publish the certified tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" certification-receipt.txt \
            --verify-tag \
            --title "tine-storage $GITHUB_REF_NAME" \
            --notes "Independent physical-storage release certified by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
