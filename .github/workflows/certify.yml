name: certify

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-complete:
    name: Linux complete physical suite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --all-features

  windows-complete:
    name: Windows complete physical suite
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked --all-features

  android-compile:
    name: Android arm64 compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
      - name: Install the Tine Android NDK compiler
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.3.11579264" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo check --locked --target aarch64-linux-android

  api-semver:
    name: Public API and semver
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked api_surface
      - run: cargo test --locked --test public_boundary
      - name: Check against the preceding storage tag when one exists
        shell: bash
        run: |
          baseline="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$baseline" ]; then
            echo "Initial release: no semver baseline exists yet."
            exit 0
          fi
          cargo install cargo-semver-checks --locked --version 0.42.0
          cargo semver-checks check-release --baseline-rev "$baseline"

  receipt:
    name: Immutable certification receipt
    needs: [linux-complete, windows-complete, android-compile, api-semver]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Require tag/package agreement for tagged certification
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Generate exact receipt
        run: bash scripts/generate-certification-receipt.sh certification-receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tine-storage-certification-${{ github.sha }}
          path: certification-receipt.txt
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: certification-receipt.txt
      - name: Publish the certified tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" certification-receipt.txt \
            --verify-tag \
            --title "tine-storage $GITHUB_REF_NAME" \
            --notes "Independent physical-storage release certified by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
