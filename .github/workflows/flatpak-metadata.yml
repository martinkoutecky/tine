# Validate the installed bundle's software-centre metadata and desktop entry.
name: Flatpak metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flatpak/**"
      - "scripts/derive-flatpak-identity.mjs"
      - ".github/workflows/flatpak-metadata.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install AppStream + desktop-file tools
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils

      - name: Validate AppStream metainfo
        run: appstreamcli validate --explain flatpak/page.tine.Tine.metainfo.xml

      - name: Validate .desktop entry
        run: desktop-file-validate flatpak/page.tine.Tine.desktop

      # Non-released identities are derived from the files above at build time
      # (scripts/derive-flatpak-identity.mjs); validate what that produces for the
      # identity this tree ships so a Beta bundle cannot fail only in the real build.
      - name: Validate the derived metainfo and .desktop for the shipped identity
        run: |
          ship=$(node -p 'require("./src-tauri/app-identity.json").ship')
          [ "$ship" = release ] && { echo "tree ships the released identity: nothing derived"; exit 0; }
          node scripts/derive-flatpak-identity.mjs --identity "$ship"
          for f in flatpak/derived/*.metainfo.xml; do appstreamcli validate --explain "$f"; done
          for f in flatpak/derived/*.desktop; do desktop-file-validate "$f"; done
