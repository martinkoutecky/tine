name: Android SafeBack ownership
run-name: Android SafeBack ownership / ${{ github.sha }}

# Focused hosted proof: deliberately separate from the blocking release matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safeback:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2048m
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: android-safeback-x86_64
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android build toolchain
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;26.3.11579264" "platform-tools"
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          for v in NDK_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME; do
            echo "$v=$NDK" >> "$GITHUB_ENV"
          done
          # As in release.yml, prevent Tauri from discovering a newer runner NDK.
          find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d ! -name "26.3.11579264" -exec rm -rf {} +
          rm -rf "$ANDROID_SDK_ROOT/ndk-bundle"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - run: npm ci
      - name: Prepare Android namespace and candidate evidence
        run: |
          node scripts/release-workflow-inputs.mjs android-config
          mkdir -p artifacts/safeback-ci
          git rev-parse HEAD > artifacts/safeback-ci/candidate-sha.txt

      - name: Build debug x86_64 app and instrumentation APKs
        run: |
          npx tauri android build --debug --target x86_64 --apk --ci
          cd src-tauri/gen/android
          # Tauri's one-shot Rust build server has exited. Package its exact
          # native output without asking Gradle's Rust bridge to rebuild it.
          ./gradlew :app:assembleUniversalDebug :app:assembleUniversalDebugAndroidTest \
            -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 \
            -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run SafeBackOwnershipTest in an isolated app lifetime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-safeback.sh

      - name: Upload instrumentation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-safeback-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/safeback-ci
          if-no-files-found: warn
          retention-days: 14
