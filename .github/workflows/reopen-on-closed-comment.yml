name: reopen-on-closed-comment

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: issue-reopen-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reopen:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Flag reporter follow-up for triage (never reopens)
        uses: actions/github-script@v8
        with:
          script: |
            const { flagFollowup } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/github/issue-intake.mjs`);
            await flagFollowup({ github, context });
