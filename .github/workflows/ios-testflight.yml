# Build and optionally upload a signed iOS archive for TestFlight.
#
# This workflow is deliberately manual. The default action only builds and
# preserves the IPA; validation and upload must be selected explicitly. Upload
# sends a build to App Store Connect/TestFlight processing, never to production
# App Store review or release.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do after building the signed IPA
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - validate
          - upload

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # D-20261107-IB / GH #890: Beta and stable have separate apps, profiles,
      # App Groups, iCloud containers and artwork. No Beta-as-stable fallback.
      - name: Select iOS distribution identity
        id: identity
        run: node scripts/ios-distribution-inputs.mjs

      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.20

      - run: npm ci

      - run: npx playwright install chromium

      - name: Verify the deployed quick share viewer before enabling the writer
        id: viewer-ready
        # As in release.yml, an unavailable viewer leaves the writer disabled.
        continue-on-error: true
        run: node scripts/check-release-readiness.mjs --quick-share-only

      - name: Require iOS distribution secrets
        shell: bash
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets[steps.identity.outputs.profile_secret] }}
          IOS_SHARE_EXTENSION_MOBILE_PROVISION: ${{ secrets[steps.identity.outputs.extension_profile_secret] }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION IOS_SHARE_EXTENSION_MOBILE_PROVISION APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::required iOS distribution secret $name is missing"
              missing=1
            fi
          done
          if [ "${{ inputs.action }}" != "build-only" ]; then
            for name in APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
              if [ -z "${!name:-}" ]; then
                echo "::error::required App Store Connect secret $name is missing"
                missing=1
              fi
            done
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Build frontend
        run: npm run build

      - name: Generate iOS project
        run: npx tauri ios init --ci --verbose

      # macOS 26 no longer reliably infers PKCS#12 input for `security import`.
      # Import both signing inputs explicitly and generate the Xcode project
      # with manual settings. This avoids Tauri 2.11's broken pbxproj mutation
      # while keeping all profile and keychain material ephemeral.
      - name: Install iOS signing materials
        shell: bash
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets[steps.identity.outputs.profile_secret] }}
          IOS_SHARE_EXTENSION_MOBILE_PROVISION: ${{ secrets[steps.identity.outputs.extension_profile_secret] }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/tine-ios-signing.keychain-db"
          p12="$RUNNER_TEMP/tine-ios-distribution.p12"
          profile="$RUNNER_TEMP/tine-ios.mobileprovision"
          profile_plist="$RUNNER_TEMP/tine-profile.plist"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"

          keychains=("$keychain")
          while IFS= read -r listed; do
            listed="${listed//\"/}"
            listed="${listed#"${listed%%[![:space:]]*}"}"
            [ -n "$listed" ] && keychains+=("$listed")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain" |
            grep -Fq "Apple Distribution: Martin Koutecky ($APPLE_TEAM_ID)"

          printf '%s' "$IOS_MOBILE_PROVISION" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")" = "$APPLE_TEAM_ID.$IOS_APP_IDENTIFIER" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")" = "false" ]
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers' "$profile_plist" | grep -Fq "$IOS_ICLOUD_CONTAINER"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.ubiquity-container-identifiers' "$profile_plist" | grep -Fq "$IOS_ICLOUD_CONTAINER"
          # The share inbox lives in the App Group the app and its Share
          # Extension share (ADR 0073); both profiles must grant it.
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$profile_plist" | grep -Fq "$IOS_APP_GROUP"

          ext_profile="$RUNNER_TEMP/tine-ios-share-extension.mobileprovision"
          ext_profile_plist="$RUNNER_TEMP/tine-share-extension-profile.plist"
          printf '%s' "$IOS_SHARE_EXTENSION_MOBILE_PROVISION" | base64 --decode > "$ext_profile"
          security cms -D -i "$ext_profile" > "$ext_profile_plist"
          ext_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$ext_profile_plist")"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$ext_profile_plist")" = "$APPLE_TEAM_ID.$IOS_EXTENSION_IDENTIFIER" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$ext_profile_plist")" = "false" ]
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$ext_profile_plist" | grep -Fq "$IOS_APP_GROUP"

          legacy_profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode_profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          install -d -m 700 "$legacy_profiles" "$xcode_profiles"
          install -m 600 "$profile" "$legacy_profiles/$profile_uuid.mobileprovision"
          install -m 600 "$profile" "$xcode_profiles/$profile_uuid.mobileprovision"
          install -m 600 "$ext_profile" "$legacy_profiles/$ext_profile_uuid.mobileprovision"
          install -m 600 "$ext_profile" "$xcode_profiles/$ext_profile_uuid.mobileprovision"

          rm -f "$p12"
          echo "IOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_IDENTITY=Apple Distribution: Martin Koutecky ($APPLE_TEAM_ID)" >> "$GITHUB_ENV"
          echo "IOS_PROVISIONING_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "IOS_PROVISIONING_PROFILE_LEGACY=$legacy_profiles/$profile_uuid.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_PROVISIONING_PROFILE_XCODE=$xcode_profiles/$profile_uuid.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_SHARE_EXTENSION_PROFILE_UUID=$ext_profile_uuid" >> "$GITHUB_ENV"
          echo "IOS_SHARE_EXTENSION_PROFILE_LEGACY=$legacy_profiles/$ext_profile_uuid.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_SHARE_EXTENSION_PROFILE_XCODE=$xcode_profiles/$ext_profile_uuid.mobileprovision" >> "$GITHUB_ENV"

      - name: Install iCloud entitlements and manual signing config
        run: npm run ios:prepare-project

      - name: Build signed TestFlight IPA
        env:
          TINE_QUICK_SHARE_VIEWER_G1_READY: ${{ steps.viewer-ready.outputs.quick_share_viewer_g1_ready }}
        run: >-
          npx tauri ios build
          --export-method app-store-connect
          --build-number "${GITHUB_RUN_NUMBER}"
          --ci

      - name: Verify signed IPA contract
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$*"
            exit 1
          }
          require_file() {
            [ -f "$1" ] || fail "$2 is missing"
          }
          expect_plist() {
            local file="$1" key="$2" expected="$3" label="$4" actual
            actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$file")" ||
              fail "$label is absent"
            [ "$actual" = "$expected" ] ||
              fail "$label mismatch: expected '$expected', got '$actual'"
          }
          expect_plist_contains() {
            local file="$1" key="$2" expected="$3" label="$4" actual
            actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$file")" ||
              fail "$label is absent"
            grep -Fq "$expected" <<< "$actual" ||
              fail "$label does not contain '$expected'"
          }

          ipa=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [ -z "$ipa" ]; then
            fail "Tauri did not produce an iOS IPA"
          fi

          unpack="$RUNNER_TEMP/tine-ipa"
          rm -rf "$unpack"
          mkdir -p "$unpack" artifacts
          unzip -q "$ipa" -d "$unpack"
          app=$(find "$unpack/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            fail "IPA does not contain an application bundle"
          fi

          info="$app/Info.plist"
          require_file "$info" "application Info.plist"
          expect_plist "$info" CFBundleIdentifier "$IOS_APP_IDENTIFIER" "bundle identifier"
          expect_plist "$info" CFBundleDisplayName "$IOS_DISPLAY_NAME" "bundle display name"
          expect_plist "$info" CFBundleShortVersionString "$IOS_MARKETING_VERSION" "marketing version"
          expect_plist "$info" CFBundleVersion "$IOS_BUILD_VERSION" "build version"
          expect_plist "$info" ITSAppUsesNonExemptEncryption false "export-compliance declaration"
          require_file "$app/PrivacyInfo.xcprivacy" "root privacy manifest"
          require_file "$app/embedded.mobileprovision" "embedded provisioning profile"
          bundled_icon="$app/AppIcon60x60@2x.png"
          decoded_icon="$RUNNER_TEMP/tine-ios-primary-icon.png"
          require_file "$bundled_icon" "compiled primary application icon"
          xcrun pngcrush -q -revert-iphone-optimizations "$bundled_icon" "$decoded_icon"
          node scripts/verify-ios-app-icon.mjs \
            "src-tauri/$IOS_ICON_DIRECTORY/AppIcon-60x60@2x.png" \
            "$decoded_icon"

          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/tine-profile.plist"
          expect_plist "$RUNNER_TEMP/tine-profile.plist" Entitlements:application-identifier "$APPLE_TEAM_ID.$IOS_APP_IDENTIFIER" "profile application identifier"
          expect_plist "$RUNNER_TEMP/tine-profile.plist" Entitlements:get-task-allow false "profile distribution policy"
          expect_plist_contains "$RUNNER_TEMP/tine-profile.plist" Entitlements:com.apple.developer.icloud-container-identifiers "$IOS_ICLOUD_CONTAINER" "profile iCloud container"
          expect_plist_contains "$RUNNER_TEMP/tine-profile.plist" Entitlements:com.apple.developer.ubiquity-container-identifiers "$IOS_ICLOUD_CONTAINER" "profile ubiquity container"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2> "$RUNNER_TEMP/tine-ios-codesign.txt"
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/tine-ios-codesign.txt" ||
            fail "code signature does not belong to the configured Apple team"
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/tine-ios-entitlements.plist"
          expect_plist_contains "$RUNNER_TEMP/tine-ios-entitlements.plist" com.apple.developer.icloud-container-identifiers "$IOS_ICLOUD_CONTAINER" "signed iCloud container"
          expect_plist_contains "$RUNNER_TEMP/tine-ios-entitlements.plist" com.apple.developer.icloud-services CloudDocuments "signed iCloud service"
          expect_plist_contains "$RUNNER_TEMP/tine-ios-entitlements.plist" com.apple.developer.ubiquity-container-identifiers "$IOS_ICLOUD_CONTAINER" "signed ubiquity container"
          expect_plist_contains "$RUNNER_TEMP/tine-ios-entitlements.plist" com.apple.security.application-groups "$IOS_APP_GROUP" "signed App Group"

          # The embedded Share Extension (ADR 0073): its own identity and
          # profile, the shared App Group, and the app's exact versions.
          appex="$app/PlugIns/TineShareExtension.appex"
          [ -d "$appex" ] || fail "the Share Extension is not embedded"
          expect_plist "$appex/Info.plist" CFBundleIdentifier "$IOS_EXTENSION_IDENTIFIER" "extension bundle identifier"
          expect_plist "$appex/Info.plist" CFBundleDisplayName "$IOS_EXTENSION_DISPLAY_NAME" "extension display name"
          expect_plist "$appex/Info.plist" NSExtension:NSExtensionPointIdentifier com.apple.share-services "extension point"
          expect_plist "$appex/Info.plist" CFBundleVersion "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" "extension build version"
          expect_plist "$appex/Info.plist" CFBundleShortVersionString "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" "extension marketing version"
          require_file "$appex/embedded.mobileprovision" "extension provisioning profile"
          security cms -D -i "$appex/embedded.mobileprovision" > "$RUNNER_TEMP/tine-ext-profile.plist"
          expect_plist "$RUNNER_TEMP/tine-ext-profile.plist" Entitlements:application-identifier "$APPLE_TEAM_ID.$IOS_EXTENSION_IDENTIFIER" "extension profile application identifier"
          codesign -d --entitlements :- "$appex" > "$RUNNER_TEMP/tine-ext-entitlements.plist"
          expect_plist_contains "$RUNNER_TEMP/tine-ext-entitlements.plist" com.apple.security.application-groups "$IOS_APP_GROUP" "extension App Group"
          # Quick actions (I5).
          expect_plist_contains "$info" UIApplicationShortcutItems tine://capture "Home Screen quick actions"

          staged="artifacts/${IOS_DISPLAY_NAME// /-}-${GITHUB_RUN_NUMBER}.ipa"
          cp "$ipa" "$staged"
          echo "TINE_IPA=$GITHUB_WORKSPACE/$staged" >> "$GITHUB_ENV"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tine-ios-testflight-${{ github.sha }}-${{ github.run_number }}
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Prepare App Store Connect authentication
        if: inputs.action != 'build-only'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          install -d -m 700 "$key_dir"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

      - name: Validate IPA with App Store Connect
        if: inputs.action != 'build-only'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          xcrun altool --validate-app --type ios
          --file "$TINE_IPA"
          --apiKey "$APPLE_API_KEY"
          --apiIssuer "$APPLE_API_ISSUER"
          --output-format json

      - name: Upload IPA to TestFlight
        if: inputs.action == 'upload'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          xcrun altool --upload-package "$TINE_IPA" --type ios
          --apple-id "$IOS_APP_STORE_APPLE_ID"
          --bundle-id "$IOS_APP_IDENTIFIER"
          --bundle-short-version-string "$IOS_MARKETING_VERSION"
          --bundle-version "$IOS_BUILD_VERSION"
          --apiKey "$APPLE_API_KEY"
          --apiIssuer "$APPLE_API_ISSUER"
          --output-format json

      - name: Remove Apple signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${IOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$IOS_SIGNING_KEYCHAIN" || true
          fi
          rm -f "${IOS_PROVISIONING_PROFILE_LEGACY:-}" "${IOS_PROVISIONING_PROFILE_XCODE:-}"
          rm -f "${IOS_SHARE_EXTENSION_PROFILE_LEGACY:-}" "${IOS_SHARE_EXTENSION_PROFILE_XCODE:-}"
          rm -f "$RUNNER_TEMP/tine-ios-share-extension.mobileprovision" "$RUNNER_TEMP/tine-share-extension-profile.plist"
          rm -f "$RUNNER_TEMP/tine-ext-profile.plist" "$RUNNER_TEMP/tine-ext-entitlements.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -rf "$RUNNER_TEMP/tine-ipa"
          rm -f "$RUNNER_TEMP/tine-ios-distribution.p12" "$RUNNER_TEMP/tine-ios.mobileprovision"
          rm -f "$RUNNER_TEMP/tine-profile.plist" "$RUNNER_TEMP/tine-ios-codesign.txt" "$RUNNER_TEMP/tine-ios-entitlements.plist"
