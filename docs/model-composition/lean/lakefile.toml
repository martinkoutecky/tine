roots = ["CompositionCodec", "CompositionAdmission", "CompositionWitnesses",
  "CompositionBatchCodec", "CompositionBatchAdmission", "CompositionBatchWitnesses",
  "CompositionSpellingCodec", "CompositionSpellingAdmission", "CompositionSpellingWitnesses"]
