<!doctype html>
<html lang="en" class="tine-quick-share">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-viewer-route'; style-src 'self' 'unsafe-inline'; connect-src https://gist.githubusercontent.com https://api.github.com; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="tine-published" content="quick-share:2">
  <title>Tine share</title>

<body>
  <div id="root"></div>
  <template id="missing-page"><h1>Page not found</h1><a href="/">Tine home</a></template>
  <script id="viewer-route">
    if (location.pathname.startsWith("%BASE_URL%")) {
      document.head.append(document.getElementById("viewer-assets").content);
    } else {
      document.getElementById("root").append(document.getElementById("missing-page").content);
    }
  </script>
</body>
</html>
