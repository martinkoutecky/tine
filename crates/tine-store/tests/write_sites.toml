[[site]]
file = "src-tauri/src/owner/git_stale_lock.rs"
fn = "remove_within"
domain = "dotgit"
guard = "src-tauri/src/owner/git_run.rs#GitMutationGuard::check_path"
test = "src-tauri/src/owner/git_mobile_tests.rs#a_lock_replaced_between_check_and_move_is_linked_back_never_deleted"
oracle = false
note = "D-20261029-GSL: explicit click only, under RUN_LOCK, on the guard-checked index.lock and same-gitdir aside path. Recheck regular empty stale lock and offered times; rename aside, verify the moved token, then delete. A changed replacement is hard-linked back without replacing another lock; failed restoration preserves the named aside file. Crash may leave an aside file; no graph/index/ref write. Frozen third-party holders, clock skew and native check-to-call limits are documented in storage-contract I-8."
mutations = "fs::hard_link=1, fs::remove_file=2, fs::rename=1"
