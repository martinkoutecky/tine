[package]
name = "tine-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-faults = []

[dependencies]
tine-core = { path = "../tine-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
regex = "1"
libc = "0.2"
cap-std = "4.0.2"
same-file = "1.0.6"
unicode-normalization = "0.1"
unicode-segmentation = "1"
notify = "6"
# Launch checkpoint (storage spec §7.6): postcard body, zstd frame.
postcard = { version = "1", default-features = false, features = ["use-std"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tine-graph-features = { path = "../tine-graph-features", features = ["test-faults"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
tine-core = { path = "../tine-core", features = ["test-counters"] }
# Fault injection for tests/transaction.rs runs in the ordinary workspace test gate.
tine-store = { path = ".", features = ["test-faults"] }
pretty_assertions = "1"

[[example]]
name = "checkpoint_launch_bench"
required-features = ["test-faults"]

[[example]]
name = "qf2_native_bench"
required-features = ["test-faults"]
