[package]
name = "tine-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-faults = []
legacy-fixtures = []

[dependencies]
tine-core = { path = "../tine-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
regex = "1"
libc = "0.2"
cap-std = "4.0.2"
same-file = "1.0.6"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tine-graph-features = { path = "../tine-graph-features" }
syn = { version = "2", features = ["full"] }
quote = "1"
tine-core = { path = "../tine-core", features = ["test-counters"] }
# Fault injection for tests/transaction.rs runs in the ordinary workspace test gate.
tine-store = { path = ".", features = ["test-faults", "legacy-fixtures"] }
pretty_assertions = "1"
