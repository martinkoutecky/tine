[package]
autotests = false
name = "tine-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
tine-search = { path = "../tine-search" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
ammonia = "4"
lsdoc = { git = "https://github.com/martinkoutecky/lsdoc", tag = "v0.5.12" }
tine-outline = { path = "../tine-outline" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The one clock (`clock`): std natively, the browser's on wasm32.
web-time = "1"
# OG `url?` (page names that are URLs are not namespaces): the WHATWG parse.
url = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
memchr = "2"
# TQL (`query::tql`) parses its filter grammar with sqlparser; pure Rust, no
# SQLite. The version and `visitor` feature match master (0.62).
sqlparser = { version = "0.62", features = ["visitor"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = "1"

# The browser build (wasm32-unknown-unknown): uuid's randomness and chrono's
# local time come from the JS host. regex without its default `perf` engines,
# as tine-search builds it (about 150 KB of wasm; natively they stay on).
[target.'cfg(target_arch = "wasm32")'.dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
uuid = { workspace = true, features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[features]
# Exposes allocation counters to downstream crates' tests (tine-store).
test-counters = []
# Test-only fault hooks and test-support helpers (items only tests call, such
# as `DocBlock::refs_contains`) for this crate's integration tests and
# downstream crates' tests (tine-store); a shipped build never enables it.
test-faults = []

[dev-dependencies]
# The integration tests link the library without `cfg(test)`.
tine-core = { path = ".", features = ["test-faults"] }
libc = "0.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
pretty_assertions = "1"

# Keep all integration cases in one linked executable.
[[test]]
name = "integration"
path = "tests/integration.rs"
