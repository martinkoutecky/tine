[package]
name = "tine-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
ammonia = "4"
lsdoc = { git = "https://github.com/martinkoutecky/lsdoc", tag = "v0.5.4" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
unicode-normalization = "0.1"

[features]
# Exposes allocation counters to downstream crates' tests (tine-store).
test-counters = []

[dev-dependencies]
libc = "0.2"
pretty_assertions = "1"
