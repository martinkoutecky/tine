[package]
autotests = false
name = "tine-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tine-search = { path = "../tine-search" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
ammonia = "4"
lsdoc = { git = "https://github.com/martinkoutecky/lsdoc", tag = "v0.5.10" }
tine-outline = { path = "../tine-outline" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
memchr = "2"
# TQL (`query::tql`) parses its filter grammar with sqlparser; pure Rust, no
# SQLite. The version and `visitor` feature match master (0.62).
sqlparser = { version = "0.62", features = ["visitor"] }

[features]
# Exposes allocation counters to downstream crates' tests (tine-store).
test-counters = []

[dev-dependencies]
libc = "0.2"
pretty_assertions = "1"

# Keep all integration cases in one linked executable.
[[test]]
name = "integration"
path = "tests/integration.rs"
