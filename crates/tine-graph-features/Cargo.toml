[package]
autotests = false
name = "tine-graph-features"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Test helpers over tine-store's test-faults surface (for example
# `pages::rename_page_expected`); never enabled by a production build.
test-faults = ["tine-store/test-faults"]

[dependencies]
tine-core = { path = "../tine-core" }
tine-guide = { path = "../tine-guide" }
tine-store = { path = "../tine-store" }
serde = { workspace = true }
# `unbounded_depth`: quick share's `validate_document` reads a document nested
# deeper than serde's default 128 containers, after bounding it itself.
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2 = "0.10"
tempfile = "3"
# Quick share (docs/contracts/quick-share.md): HKDF + AES-256-GCM, gzip,
# base64url. All three were already in the lockfile.
base64 = "0.22"
flate2 = "1"
ring = "0.17"
time = { version = "0.3.49", features = ["formatting"] }

[dev-dependencies]
lsdoc = { git = "https://github.com/martinkoutecky/lsdoc", tag = "v0.5.11" }
tine-core = { path = "../tine-core", features = ["test-counters", "test-faults"] }
tine-store = { path = "../tine-store", features = ["test-faults"] }
tine-graph-features = { path = ".", features = ["test-faults"] }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"

# One linked executable for every integration case (scripts/test-rust-integration-layout.mjs).
[[test]]
name = "integration"
path = "tests/integration.rs"

