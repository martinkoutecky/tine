# WASM wrapper for Tine's parser and optional browser graph core.
#
# It ships only as `wasm32-unknown-unknown`, built by `npm run build:wasm` with the
# workspace's `wasm-release` profile (../../Cargo.toml).
#
# To regenerate both vendored modules, run:
#   npm run build:wasm
[package]
name = "lsdoc-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz"]

[features]
core = ["dep:tine-store", "dep:tine-graph-features"]

[dependencies]
unicode-normalization = "0.1"
tine-search = { path = "../tine-search" }
# The core's own modules (dates, EDN, render facets, reference evidence, ...),
# which this crate once compiled in by path.
tine-core = { path = "../tine-core" }
# The browser core: the store's whole-graph view of files held in memory, and
# the answers' wire forms the desktop app sends (one serializer per answer).
tine-store = { path = "../tine-store", optional = true }
tine-graph-features = { path = "../tine-graph-features", optional = true }
# The outline kernel crate (lsdoc + serde only): block regions, logbook, the
# property-line grammar, the page-filename codec and the one-block parse boundary.
tine-outline = { path = "../tine-outline" }
# Keep this tag IN SYNC with crates/tine-core/Cargo.toml's and crates/tine-outline/Cargo.toml's lsdoc pin.
lsdoc = { git = "https://github.com/martinkoutecky/lsdoc", tag = "v0.5.12" }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
