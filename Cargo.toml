[workspace]
members = ["crates/tine-search", "crates/tine-outline", "crates/tine-core", "crates/tine-store", "crates/tine-graph-features", "plugin-sdk/rust", "src-tauri", "src-tauri/ios-folder-picker-native", "src-tauri/ios-native-integrations"]
# lsdoc-wasm is built ONLY by `npm run build:wasm` (wasm-pack, wasm32 target) to
# regenerate the vendored frontend parser. Excluded so normal `cargo build`/`cargo
# test --workspace` (host target) never touch it. See docs/wasm-parse-plan.md.
exclude = [
    "crates/lsdoc-wasm",
    "vendor/cap-primitives-4.0.2",
]
resolver = "2"

[workspace.package]
version = "0.8.2"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Martin Koutecký"]

# Reproducible builds (F-Droid #reproducible): the default release profile uses 16
# parallel codegen units, whose output order (and cross-unit local-symbol renaming)
# is nondeterministic — two builds of the same source produce differently-ordered
# .so files. A single codegen unit makes the native lib byte-deterministic (at some
# build-time/-speed cost). codegen-units is a stable profile key.
[profile.release]
codegen-units = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[patch.crates-io]
# GH #533: preserve absolute UNC paths reconstructed from retained Windows handles.
cap-primitives = { path = "vendor/cap-primitives-4.0.2" }

# Keep source locations for workspace backtraces without third-party debug data.
# The test profile inherits these settings from dev.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
