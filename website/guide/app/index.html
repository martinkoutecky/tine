<!doctype html>
<html lang="en" data-theme="light" data-color="logseq">
  <head><meta name="tine-published" content="snapshot.json">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Tine Guide</title>
    <style id="tine-startup-style">
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      html,
      body {
        background: var(--bg-primary, #ffffff);
        color: var(--text-primary, #374151);
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: var(--bg-primary, #1a1b1e);
        color: var(--text-primary, #d1d5db);
      }
      .startup-shell {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font: 500 14px/1.4 system-ui, sans-serif;
      }
      .startup-shell-mark {
        width: 15px;
        height: 15px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: tine-startup-spin 0.8s linear infinite;
      }
      @keyframes tine-startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-shell-mark { animation: none; }
      }
    </style>
    <script>
      try {
        const preference = localStorage.getItem("logseq-claude.theme");
        const dark = preference === "dark" ||
          (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (_) {
        // The deterministic light default on <html> remains usable.
      }
    </script>
    <script type="module" crossorigin src="./assets/main-C8kf-asH.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/app-BBSWYxDX.js">
    <link rel="stylesheet" crossorigin href="./assets/app-H-D6cp9f.css">
    <link rel="stylesheet" crossorigin href="./assets/main-UdLNOgRp.css">
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-live="polite">
        <span class="startup-shell-mark" aria-hidden="true"></span>
        <span>Opening Tine…</span>
      </div>
    </div>
    <script id="tine-engine-check">
      // GH #572. Tine needs the web engine of Safari 15.4 or later: the parser is
      // wasm with reference types (Safari 15) and the frontend uses ES2022
      // built-ins such as Array.prototype.at (Safari 15.4). An older engine loads
      // Tine half-broken, so say so plainly instead. Deliberately ES5: this must
      // parse on the engines it rejects. main.tsx stops on the flag it sets.
      (function () {
        var wasmReferenceTypes = false;
        try {
          wasmReferenceTypes = WebAssembly.validate(new Uint8Array([
            0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 1, 111, 0
          ]));
        } catch (_) {}
        if (
          typeof Array.prototype.at === "function" &&
          typeof Object.hasOwn === "function" &&
          typeof structuredClone === "function" &&
          wasmReferenceTypes
        ) return;
        window.__tineUnsupportedEngine = true;
        var apple = /Mac|iPhone|iPad/.test(navigator.userAgent || "");
        var root = document.getElementById("root");
        root.innerHTML =
          '<div class="startup-shell" role="alert" style="flex-direction:column;padding:24px;text-align:center">' +
          "<strong>This system's web engine is too old for Tine.</strong>" +
          "<span>Tine needs the engine of Safari 15.4 or later.</span>" +
          "<span>" + (apple
            ? "On a Mac, Tine needs macOS 12.3 (Monterey) or later: apps use the web engine that came with macOS, and updating the Safari app alone does not update it. On iPhone or iPad, update to iOS 15.4 or later."
            : "Update your system's web view and restart Tine.") + "</span>" +
          "</div>";
      })();
    </script>
  </body>
</html>
